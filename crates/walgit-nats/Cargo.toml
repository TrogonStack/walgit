[package]
name = "walgit-nats"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "walgit-nats"
path = "src/bin/walgit-nats.rs"

[dependencies]
walgit-events.workspace = true
walgit-config.workspace = true
walgit-store.workspace = true
walgit-git.workspace = true
walgit-wal.workspace = true
walgit-telemetry.workspace = true
clap.workspace = true
mimalloc.workspace = true
async-nats.workspace = true
nkeys.workspace = true
percent-encoding.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# `testing::start_nats`: a throwaway `nats-server -js` for integration tests.
testing = ["dep:tempfile"]

[dev-dependencies]
walgit-nats = { path = ".", features = ["testing"] }
walgit-proto.workspace = true
tempfile.workspace = true
rcgen.workspace = true
rustls.workspace = true

[lints]
workspace = true
