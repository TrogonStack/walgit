name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e) — so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; main is not. A cancelled main run takes
  # publish-canary down with it (run-level cancellation ignores job-level concurrency),
  # and that commit's immutable sha- tag would then never exist.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: only publish-canary needs a write scope, and it asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: warnings + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain version here on purpose: rust-toolchain.toml pins it (and its components).
      # `rustup show` installs exactly that, so the pin has one home.
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build

      - run: just warnings
      - run: just clippy
      - run: just test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      - run: just e2e

  # Canary image publish. Lives in this workflow, not a separate one, so `needs` gates it on the
  # same green run that just tested the commit: a red main never produces a canary tag, and there
  # is no workflow_run indirection re-deriving the SHA from an event payload.
  #
  #   ghcr.io/<owner>/walgit:canary    moving tag, always the newest green main
  #   ghcr.io/<owner>/walgit:sha-<40>  immutable, what a rollback or a bug report pins to
  #
  # Re-running a run on the same commit is safe: it rebuilds and moves both tags to the new
  # image. The tag set is a pure function of the commit, but the digest is not (the build is
  # not bit-reproducible), so a re-run republishes rather than no-ops.
  publish-canary:
    name: publish canary image
    needs: [build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write scope this workflow needs; GITHUB_TOKEN carries nothing else.
      packages: write
    steps:
      # This job holds a token that can write packages, so its actions are pinned to commit SHAs:
      # a moving tag would let an upstream compromise reach the registry. The other jobs read only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here runs git again; leaving the token in .git/config only widens the blast radius.
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # format=long, not short: a seven-character prefix is a namespace that collides, and the
      # collision would silently move an older commit's immutable tag onto a newer image. Both tags
      # and the OCI source/revision labels come from one place rather than hand-built strings.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build stage never copies .git, so this ARG is the binary's only build identity:
          # without it walgit-server/build.rs falls back to "dev" and every image reports the same
          # version on /healthz. Full 40 chars: build.rs takes the value verbatim.
          build-args: |
            WALGIT_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
